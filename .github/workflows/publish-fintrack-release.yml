name: Publish public FinTrack downloads

on:
  workflow_run:
    workflows: ["FinTrack Mac — build and test"]
    types: [completed]
    branches: [main]

concurrency:
  group: fintrack-download-publish
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  release:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout public repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download validated build artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" --repo "$GH_REPO" --name FinTrack-Mac-Apple-Silicon --dir ./staging

      - name: Check full app bundle before making it public
        run: |
          set -euo pipefail
          test -s staging/FinTrack-Mac-Apple-Silicon.zip
          test -s staging/FinTrack-Mac-Apple-Silicon.dmg
          unzip -q staging/FinTrack-Mac-Apple-Silicon.zip -d unpacked
          EXE="unpacked/FinTrack-Mac/FinTrack Mac.app/Contents/MacOS/MintLeaf"
          test -s "$EXE" || { echo "::error::Executable missing from ZIP"; exit 1; }
          file "$EXE"
          file "$EXE" | grep -Eq 'Mach-O.*arm64' || { echo "::error::Not a macOS arm64 executable"; exit 1; }
          echo "Validated executable bytes: $(wc -c < "$EXE")"

      - name: Publish tested downloads into the public repository
        env:
          BUILD_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          set -euo pipefail
          mkdir -p downloads
          CURRENT="$(cat downloads/build-number.txt 2>/dev/null || echo 0)"
          if [ "$CURRENT" -gt "$BUILD_NUMBER" ]; then
            echo "Newer build already published, skipping older artifact."
            exit 0
          fi
          cp staging/FinTrack-Mac-Apple-Silicon.dmg downloads/FinTrack-Mac-Apple-Silicon.dmg
          cp staging/FinTrack-Mac-Apple-Silicon.zip downloads/FinTrack-Mac-Apple-Silicon.zip
          echo "$BUILD_NUMBER" > downloads/build-number.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/
          if git diff --cached --quiet; then
            echo "Download files are already current."
          else
            git commit -m "Publish verified FinTrack Mac build $BUILD_NUMBER [skip ci]"
            git push origin HEAD:main
          fi
