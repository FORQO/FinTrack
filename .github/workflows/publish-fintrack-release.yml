name: Publish downloadable FinTrack release

on:
  workflow_run:
    workflows: ["FinTrack Mac — build and test"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  release:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download validated build artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" --repo "$GH_REPO" --name FinTrack-Mac-Apple-Silicon --dir ./downloads

      - name: Check full app bundle before making it public
        run: |
          set -euo pipefail
          test -s downloads/FinTrack-Mac-Apple-Silicon.zip
          test -s downloads/FinTrack-Mac-Apple-Silicon.dmg
          unzip -q downloads/FinTrack-Mac-Apple-Silicon.zip -d unpacked
          EXE="unpacked/FinTrack-Mac/FinTrack Mac.app/Contents/MacOS/MintLeaf"
          test -s "$EXE" || { echo "::error::Executable missing from ZIP"; exit 1; }
          file "$EXE"
          file "$EXE" | grep -Eq 'Mach-O.*arm64' || { echo "::error::Not a macOS arm64 executable"; exit 1; }
          echo "Validated executable bytes: $(wc -c < "$EXE")"

      - name: Publish public download links
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_NUMBER: ${{ github.event.workflow_run.run_number }}
          BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          TAG="v0.2.${BUILD_NUMBER}"
          gh release create "$TAG"             downloads/FinTrack-Mac-Apple-Silicon.dmg             downloads/FinTrack-Mac-Apple-Silicon.zip             --repo "$GH_REPO"             --target "$BUILD_SHA"             --title "FinTrack Mac v0.2 build ${BUILD_NUMBER}"             --notes "Тестовая сборка FinTrack Mac для Apple Silicon (M1/M2/M3/M4). Русский интерфейс, RUB/USD/EUR, новый дашборд. Оригинальная лицензия Mint Leaf — MIT. Сборка не подписана Apple; проверяйте источник файла."             --prerelease
