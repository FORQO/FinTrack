name: FinTrack Mac — build and test

on:
  push:
    branches: [main, 'fintrack/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout FinTrack patches
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version

      - name: Check Python patch tests
        run: python3 -m unittest discover -s tests -v

      - name: Fetch pinned Mint Leaf 4.2 sources
        env:
          BASE_SHA: 9731ed052196a9387527661530df791ef9011d8e
        run: |
          git clone --depth 1 --branch v4.2 https://github.com/Kolomaster68/mint-leaf.git "$RUNNER_TEMP/mintleaf-upstream"
          test "$(git -C "$RUNNER_TEMP/mintleaf-upstream" rev-parse HEAD)" = "$BASE_SHA" || {
            echo 'Unexpected upstream source revision' >&2
            exit 1
          }

      - name: Apply FinTrack changes
        run: python3 apply_ru.py "$RUNNER_TEMP/mintleaf-upstream"

      - name: Validate currencies and localization
        run: |
          python3 -m json.tool "$RUNNER_TEMP/mintleaf-upstream/MintLeaf/Localizable.xcstrings" >/dev/null
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'mintleaf-upstream'
          d = json.loads((root / 'MintLeaf/Localizable.xcstrings').read_text())
          assert d['strings']['Overview']['localizations']['ru']['stringUnit']['value'] == 'Обзор'
          currencies = (root / 'MintLeaf/Services/SupportedCurrencies.swift').read_text()
          block = currencies.split('static let all:',1)[1].split(']',1)[0]
          assert [line.split('code: "',1)[1].split('"',1)[0] for line in block.splitlines() if 'CurrencyInfo(code:' in line] == ['RUB', 'USD', 'EUR']
          assert (root / 'MintLeaf/Views/DashboardView.swift').read_text().count('struct FinTrackDashboardView: View') == 1
          PY

      - name: Run original and FinTrack XCTest
        working-directory: ${{ runner.temp }}/mintleaf-upstream
        run: |
          xcodebuild -project MintLeaf.xcodeproj \
            -scheme MintLeaf_macOS \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/fintrack-tests" \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee "$RUNNER_TEMP/tests.log" | tail -80

      - name: Build native Apple Silicon app
        working-directory: ${{ runner.temp }}/mintleaf-upstream
        run: |
          xcodebuild -project MintLeaf.xcodeproj \
            -scheme MintLeaf_macOS \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/fintrack-build" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/build.log" | tail -80

      - name: Create ZIP and DMG
        run: |
          APP="$(find "$RUNNER_TEMP/fintrack-build/Build/Products/Release" -maxdepth 1 -name '*.app' -type d -print -quit)"
          test -n "$APP"
          mkdir -p dist/FinTrack-Mac
          ditto "$APP" 'dist/FinTrack-Mac/FinTrack Mac.app'
          cp "$RUNNER_TEMP/mintleaf-upstream/LICENSE" dist/FinTrack-Mac/LICENSE-Mint-Leaf.txt
          ditto -c -k --sequesterRsrc --keepParent dist/FinTrack-Mac FinTrack-Mac-Apple-Silicon.zip
          hdiutil create -volname 'FinTrack Mac' -srcfolder dist/FinTrack-Mac -ov -format UDZO FinTrack-Mac-Apple-Silicon.dmg

      - name: Upload downloadable app and installer
        uses: actions/upload-artifact@v4
        with:
          name: FinTrack-Mac-Apple-Silicon
          path: |
            FinTrack-Mac-Apple-Silicon.zip
            FinTrack-Mac-Apple-Silicon.dmg
          if-no-files-found: error

      # Keep the full derived MIT-licensed Swift sources available in the public repo.
      # A bot push using GITHUB_TOKEN will not retrigger this workflow.
      - name: Publish reproducible Swift sources
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          rsync -a --exclude='.git' --exclude='.github' --exclude='README.md' --exclude='project.yml' \
            "$RUNNER_TEMP/mintleaf-upstream/" ./
          cp "$RUNNER_TEMP/mintleaf-upstream/project.yml" project.yml
          git add -A MintLeaf MintLeafTests MintLeaf.xcodeproj scripts project.yml LICENSE LOCALIZATION_REPORT_RU.md .gitignore
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Vendor Mint Leaf MIT sources with FinTrack Russian dashboard and FX fixes'
            git push origin HEAD:main
          fi